spring:
  data:
    redis:
      host: ${ELASTICCACHE_HOST}
      port: 6379
  batch:
    job:
      enabled: false
  application:
    name: fitdo-batch
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never