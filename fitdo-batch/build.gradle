dependencies {
    implementation project(":fitdo-mysql")
    implementation project(":fitdo-redis")

    //spring batch(fitdo-batch)
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    testImplementation 'org.springframework.batch:spring-batch-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar{
    enabled=true
}
jar{
    enabled=false
}