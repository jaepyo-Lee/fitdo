name: Java CI with Gradle

on:
  push:
    branches:
      - dev
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'


      # Gradle 캐싱
      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Print working directory
        run: pwd

      - name: Send  docker-compose.yml
        uses: appleboy/scp-action@master
        with:
          username: ubuntu
          host: ${{ secrets.AWS_PUBLIC_DNS }}
          key: ${{ secrets.AWS_PEM_KEY }}
          port: 22
          source: ./infra/docker/docker-compose.yml
          target: "/home/ubuntu/"
          strip_components: 3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :fitdo-web:build

      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker build & push
        run: |
          docker build -f ./fitdo-web/Dockerfile-web.dev -t ${{ secrets.DOCKER_USERNAME }}/fitdo-web .
          docker push ${{ secrets.DOCKER_USERNAME }}/fitdo-web

      - name: Deploy to dev
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_PUBLIC_DNS }}
          username: ubuntu
          key: ${{ secrets.AWS_PEM_KEY }}
          script: |
            cd /home/ubuntu
            
            sudo touch .env
            echo "${{ secrets.ENV_VARS }}" | sudo tee .env > /dev/null
            
            sudo chmod 666 /var/run/docker.sock
            
            sudo docker rm -f fitdo-web
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/fitdo-web
            docker compose -f docker-compose.yml --env-file ./.env up -d fitdo-web
            
            docker image prune -f