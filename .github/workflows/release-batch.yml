name: Java CI/CD with Gradle and Docker

on:
  push:
    branches:
      - dev
    paths:
      - 'fitdo-batch/**'
  pull_request:
    branches:
      - dev
    paths:
      - 'fitdo-batch/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Gradle caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew :fitdo-batch:clean :fitdo-batch:build

      - name: Verify JAR file existence
        run: ls -la fitdo-batch/build/libs/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: docker build -t ${{ secrets.ECR_PREFIX }}/fitdo-batch:latest -f ./fitdo-batch/DockerFile-Batch.dev ./fitdo-batch

      - name: Push Docker image to ECR
        run: docker push ${{ secrets.ECR_REGISTRY }}/fitdo-batch:latest

