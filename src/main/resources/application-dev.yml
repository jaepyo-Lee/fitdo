app:
  auth:
    secret: ${AUTH_SECRET}
    accessExpired: ${ACCESSTOKEN_EXPIRED_TIME}
    refreshExpired: ${REFRESHTOKEN_EXPIRED_TIME}

server:
  port: 8080

spring:
  application:
    name: fitdo
  datasource:
    hikari:
      driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_TYPE}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true